[project]
name = "bpma"
version = "0.1.0"
description = "Copy the Battersea Park Millennium Arena athletics track bookings into a Google Calendar."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-auth>=2.61.0",
    "httpx>=0.28.1",
    "pydantic-ai-slim[google]>=2.55.0",
    "requests>=2.34.2",
]

[project.scripts]
bpma = "bpma.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pydantic-evals>=2.55.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "tenacity>=9.1.4",
    "ty>=0.0.86",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ty.environment]
extra-paths = ["tests", "evals"]
