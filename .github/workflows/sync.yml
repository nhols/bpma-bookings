name: Sync

on:
  schedule:
    # 06:15, 11:15 and 16:15 UTC. Checks where nothing changed take seconds and make no model calls.
    - cron: "15 6,11,16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild future events even if the sheets on the page haven't changed
        type: boolean
        default: false

# One sync at a time. A run that starts while another is going waits for it to finish.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Scheduled runs, or manual runs by the repo owner. Nobody else can start it from the Actions tab.
    if: github.event_name == 'schedule' || github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit new sheets and runs to data/
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Update the calendar from the booking sheets
        run: uv run --locked bpma sync ${{ inputs.force && '--force' || '' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}

      # Runs even after a failure, so a sheet that was read is kept and not read again.
      - name: Commit new sheets and runs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "data: sync on $(date -u +%F) [skip ci]" && git push; }

  # GitHub turns off scheduled workflows in public repos after 60 days without activity, and the track can go
  # months without a new sheet. Re-enabling the workflow resets that clock (as liskin/gh-workflow-keepalive does).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
