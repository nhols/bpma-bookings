# TEMPORARY: checks whether an issue mention from github-actions[bot] reaches the owner's phone. Delete before merging.
name: Notify test

on:
  push:
    branches: [notify-on-changes]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --repo "${{ github.repository }}" --title "Test: calendar sync notification" \
            --body "@${{ github.repository_owner }} Test notification via an issue. If this reached your phone, issues work.")
          gh issue close "$url" --reason completed
          echo "$url"
