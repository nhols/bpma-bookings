# TEMPORARY: checks that a commit comment from github-actions[bot] notifies the repo owner. Delete before merging.
name: Notify test

on:
  push:
    branches: [notify-on-changes]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          cat > notes.md <<'NOTE'
          Test notification from the notify-on-changes PR. If this reached your GitHub notifications, it works.

          Calendar changes:
          ```diff
          - Sun 25 Oct 2026 16:30  Exclusive track booking
          + Sun 25 Oct 2026 17:00  Exclusive track booking
          ```
          NOTE

      # The same step as sync.yml
      - name: Tell the owner what changed
        if: hashFiles('notes.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "@${{ github.repository_owner }}"; echo; cat notes.md; } > comment.md
          gh api "repos/${{ github.repository }}/commits/$(git rev-parse HEAD)/comments" -F body=@comment.md
